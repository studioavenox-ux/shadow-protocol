<script>
    // Micro-interaction: Subtle speed oscillation simulation
    const speedEl = document.getElementById('speedometer-val');
    if (speedEl) {
      let speed = 124;
      setInterval(() => {
        const delta = Math.floor(Math.random() * 5) - 2;
        speed = Math.max(118, Math.min(136, speed + delta));
        speedEl.textContent = speed;
      }, 700);
